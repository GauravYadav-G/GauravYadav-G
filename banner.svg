<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#181e2e" />
    </linearGradient>
    
    <!-- Neon Text Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.07" />
    </pattern>
    
    <!-- Gradient for Accent lines -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="15" />
  <rect width="1200" height="400" fill="url(#grid)" rx="15" />

  <!-- Geometric Abstract Shapes -->
  <circle cx="1050" cy="100" r="120" fill="#00f2fe" opacity="0.03" filter="url(#glow)" />
  <circle cx="150" cy="320" r="80" fill="#7f00ff" opacity="0.05" filter="url(#glow)" />
  
  <!-- Circuit-like Lines -->
  <path d="M 0,200 L 300,200 L 350,250 L 500,250" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 1200,150 L 950,150 L 900,100 L 750,100" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="500" cy="250" r="4" fill="#00f2fe" opacity="0.7" />
  <circle cx="750" cy="100" r="4" fill="#4facfe" opacity="0.7" />

  <!-- Main Name Text -->
  <text x="100" y="180" font-family="'Fira Code', monospace, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" filter="url(#glow)" letter-spacing="2">
    GAURAV YADAV
  </text>
  
  <!-- Subtitle Text -->
  <text x="105" y="240" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#00f2fe" letter-spacing="4" opacity="0.9">
    FULL-STACK DEVELOPER &amp; AI ENGINEER
  </text>
  
  <!-- Minimalist Status Dot -->
  <circle cx="110" cy="285" r="6" fill="#10B981" />
  <text x="130" y="291" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#9ca3af" letter-spacing="1">
    Available for new opportunities
  </text>
</svg>
